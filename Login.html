<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        :root {
            --border-color: #888;
            --background-color: linear-gradient(to bottom,
                    #eaeaea 50%,
                    #b3d1f5 100%);
            --box-shadow-color: rgba(0, 0, 0, 0.08);
            --text-color: black;
            --link-color: #1abc9c;
            --background-button: #43b9ad;
            --background-button-hover: #369e9e;
            --text-button-color: #fff;
        }

        body {
            padding: 0;
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login {
            background: var(--text-button-color);
            padding: 40px 50px 30px 50px;
            border-radius: 12px;
            box-shadow: 0 2px 16px var(--box-shadow-color);
            width: 400px;
            text-align: center;
        }

        .title {
            margin-bottom: 20px;
            font-size: 2rem;
            font-weight: 600;
        }

        label {
            display: block;
            text-align: left;
            margin: 15px 0 5px;
            font-size: 1rem;
            margin-top: 1px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        button[type="submit"] {
            background: var(--background-button);
            color: var(--text-button-color);
            border: none;
            padding: 12px 40px;
            border-radius: 4px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background: var(--background-button-hover);
        }

        .link {
            font-size: 0.95rem;
            color: var(--text-color);
            margin-top: 15px;
        }

        .link a {
            color: var(--text-color);
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login">
        <h1 class="title">LOGIN</h1>

        <label for="username">Username:</label>
        <input type="text" name="username" id="username" placeholder="Enter your Username" />

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter your Password" />

        <label for="remember"> <input type="checkbox" id="remember" name="remember" checked />
            Remember for Password</label>
        <button type="submit">Login</button>

        <div class="link">
            <p><a href="forgot-pass.html">Forgot password?</a></p>
            <p><a href="Registered.html">Not registered? Register</a></p>
        </div>

    </div>

</body>

</html>
