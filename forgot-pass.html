<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot-pass</title>
    <style>
        :root {
            --border-color: #888;
            --background-color: linear-gradient(to bottom, #eaeaea 50%, #b3d1f5 100%);
            --box-shadow-color: rgba(0, 0, 0, 0.08);
            --text-color: black;
            --link-color: #1abc9c;
            --background-button: #43b9ad;
            --background-button-hover: #369e9e;
            --text-button-color: #fff;
        }

        body {
            padding: 0;
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .forgot-pass {
            background: var(--text-button-color);
            padding: 40px 50px 30px 50px;
            border-radius: 12px;
            box-shadow: 0 2px 16px var(--box-shadow-color);
            width: 400px;
            text-align: center;
        }

        .title {
            margin-bottom: 20px;
            font-size: 2rem;
            font-weight: 600;
        }

        label {
            display: block;
            text-align: left;
            margin: 15px 0 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        button {
            width: 50%;
            padding: 10px;
            background-color: var(--background-button);
            color: var(--text-button-color);
            border-radius: 6px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--background-button-hover);
        }

        .link {
            font-size: 0.95rem;
            color: var(--text-color);
            margin-top: px;
        }

        .link a {

            color: var(--text-color);
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="forgot-pass">
        <div>
            <h1 class="title">Forgot Password</h1>
            <label for="email-number">Number/Email:</label>
            <input type="text" id="email-number" name="email_number"
                placeholder="Enter your registered email or phone number" required />
            <div class="link">
                Already have an account?
                <a href="Login.html">Login here</a>
            </div>
            <button type="submit">Recover Password</button>


        </div>

    </div>

</body>

</html>
